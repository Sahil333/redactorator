# The pack every run uses (docs/designs/auto-mode.md, Technical Plan, section 6).
# How to write a rule: tools/packs/README.md.
pack: universal
rules:
  - id: payment-card
    identifier: payment-card
    # 14 to 19 digits, plain or in groups of 4 (or 4, 6 and 4 or 5). A stretch of a longer grouped
    # number that passes Luhn is offered too: from the characters alone it cannot be told from a
    # card after a year, "Ref 2026 4111 1111 1111 1111", and a missed card is the worse error.
    pattern: '(\d{14,19}|\d{4}(?:{sep}\d{4}){2,3}(?:{sep}\d{1,3})?|\d{4}{sep}\d{6}{sep}\d{4,5})'
    value: 1
    needs: checked
    notNextTo: letter-or-digit
    validator: card
    stdnum: luhn
    source: "Microsoft Purview, credit card number: 14 to 19 digits, formatted or unformatted, passing the Luhn test. https://learn.microsoft.com/en-us/purview/sit-defn-credit-card-number"
    licence: "Microsoft Learn's terms allow informational, non-commercial or personal use, without changes, with the copyright notice (https://learn.microsoft.com/en-us/legal/termsofuse)"
    verified: { date: "2026-11-28", at: "https://learn.microsoft.com/en-us/purview/sit-defn-credit-card-number" }
    examples:
      - "4000 0566 5566 5556"
      - "5500 0000 0000 0004"
      - "3400 000000 00009"
      - "3000 0000 0000 04"
    nearMisses:
      - "4000 0566 5566 5557"
      - "5500 0000 0000 0005"

  - id: email
    identifier: email
    # A local part of letters, digits and the marks RFC 5322 allows, an @, then dot-separated
    # labels and a top-level domain of letters. The lookbehind starts it where the address starts.
    pattern: "((?<![A-Za-z0-9.!#$%&'*+/=?^_`{|}~-])[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,63})"
    value: 1
    needs: format
    notNextTo: letter-or-digit
    source: "Presidio's email recognizer: a local part, an @, and a domain with at least one dot. https://raw.githubusercontent.com/data-privacy-stack/presidio/main/presidio-analyzer/presidio_analyzer/predefined_recognizers/generic/email_recognizer.py"
    licence: "Presidio is MIT-licensed"
    verified: { date: "2026-11-28", at: "https://raw.githubusercontent.com/data-privacy-stack/presidio/main/presidio-analyzer/presidio_analyzer/predefined_recognizers/generic/email_recognizer.py" }
    examples:
      - "jane.roe@example.com"
      - "j.smith+billing@mail.example.org"
    nearMisses:
      - "jane.roe@example"
      - "jane.roe.example.com"
