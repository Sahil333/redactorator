# The handles that end a UPI ID, the part after the @. Read in Chrome from NPCI's "All members"
# page for UPI: every row of the tab "UPI 3rd Party Applications" (50 apps, 69 handles, Aditya
# Birla Capital Digital to ZET, the table loading as the page scrolled), and the first ten rows
# of the tabs "UPI Bank Application" (City Union Bank the last read) and "UPI PPI Applications"
# (Pine Labs the last read). The site then answered with its error page, and the rest of those
# two tabs was not read. Handles such as those of SBI, HDFC Bank, Kotak and BHIM are therefore
# missing; the UPI rule does not need the list to find a value.
# To refresh: read the same tabs, or the file the page's Download control gives; update `read`;
# run `pnpm packs`.
